name: Build EmadShettos APK
on:
  push:
    branches: [main, Test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/emadshettos.jks"
      - name: Build signed APK
        env:
          CHANNEL: ${{ github.ref_name == 'Test' && 'test' || 'latest' }}
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/emadshettos.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleEmadShettosDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/emadShettosDebug/*.apk EmadShettos-PoolAim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EmadShettosDebug-APK
          path: EmadShettos-PoolAim.apk
      - name: Publish official release (main only)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "build=${{ github.run_number }}"
          files: EmadShettos-PoolAim.apk
      - name: Publish test release (Test only)
        if: github.ref_name == 'Test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Test build
          body: "build=${{ github.run_number }}"
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: EmadShettos-PoolAim.apk
